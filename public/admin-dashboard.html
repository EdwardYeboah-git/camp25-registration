<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4">Admin Dashboard</h2>
    <div class="d-flex justify-content-end mb-3">
      <button id="downloadExcel" class="btn btn-success">Download Excel</button>
    </div>
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Full Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Pass Type</th>
          <th>Amount</th>
          <th>Payment Status</th>
          <th>Age</th>
          <th>Gender</th>
          <th>Church</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="campersTable"></tbody>
    </table>
  </div>

  <script>
    async function fetchCampers() {
      try {
        const res = await fetch('/admin/campers');
        if (!res.ok) {
          alert("Session expired. Please login again.");
          window.location.href = "/admin-login.html";
          return;
        }
        const campers = await res.json();
        const tbody = document.getElementById("campersTable");
        tbody.innerHTML = "";

        campers.forEach(camper => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${camper.fullname}</td>
            <td>${camper.email}</td>
            <td>${camper.phone}</td>
            <td>${camper.pass_type}</td>
            <td>GHS ${camper.amount}</td>
            <td>
              <span class="badge ${camper.payment_status === 'paid' ? 'bg-success' : camper.payment_status === 'pending' ? 'bg-warning text-dark' : 'bg-danger'}">
                ${camper.payment_status}
              </span>
            </td>
            <td>${camper.age || ''}</td>
            <td>${camper.gender || ''}</td>
            <td>${camper.church || ''}</td>
            <td>
              ${camper.payment_status !== 'paid' ? `
                <button class="btn btn-sm btn-primary confirmBtn" data-email="${camper.email}">Confirm Payment</button>
              ` : `<span class="text-success">✔ Confirmed</span>`}
            </td>
          `;
          tbody.appendChild(row);
        });

        // Attach event listeners for Confirm Payment buttons
        document.querySelectorAll(".confirmBtn").forEach(btn => {
          btn.addEventListener("click", async () => {
            const email = btn.getAttribute("data-email");
            btn.disabled = true;
            btn.textContent = "Confirming…";

            try {
              const res = await fetch("/admin/confirm-payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
              });

              if (res.ok) {
                btn.classList.remove("btn-primary");
                btn.classList.add("btn-success");
                btn.textContent = "✔ Confirmed";
              } else {
                btn.disabled = false;
                btn.textContent = "Confirm Payment";
                alert("Failed to confirm payment. Try again.");
              }
            } catch (err) {
              btn.disabled = false;
              btn.textContent = "Confirm Payment";
              alert("Error: " + err.message);
            }
          });
        });
      } catch (err) {
        console.error("Error fetching campers:", err);
      }
    }

    document.getElementById("downloadExcel").addEventListener("click", () => {
      window.location.href = "/admin/download-excel";
    });

    fetchCampers();
  </script>
</body>
</html>
