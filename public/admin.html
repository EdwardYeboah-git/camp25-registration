<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Payment Confirmation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow-lg" style="width: 400px;">
    <h4 class="text-center mb-3">Confirm Bank Transfer</h4>
    <form id="confirmForm">
      <div class="mb-3">
        <label>Email of Camper</label>
        <input type="email" id="emailInput" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Reference (Optional)</label>
        <input type="text" name="reference" class="form-control" value="Manual-Confirmation">
      </div>
      <button type="submit" class="btn btn-success w-100">Confirm Payment</button>
    </form>
    <div id="responseMsg" class="alert mt-3 d-none"></div>
  </div>

    <!-- Success Popup -->
<div id="admin-success-popup" style="
display: none;
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
background: rgba(0,0,0,0.5);
z-index: 9999;
display: flex;
justify-content: center;
align-items: center;
">
<div style="
  background: #fff;
  padding: 30px 50px;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(0,0,0,0.3);
  text-align: center;
">
  <h3 style="color: #28a745;">✅ Payment Confirmed!</h3>
  <p>Receipt sent to camper’s email.</p>
</div>
</div>

  <script>
    // Prefill email if passed from dashboard
    const urlParams = new URLSearchParams(window.location.search);
    const emailFromUrl = urlParams.get("email");
    if (emailFromUrl) {
      document.getElementById("emailInput").value = emailFromUrl;
    }
  
    document.getElementById("confirmForm").addEventListener('submit', async function (e) {
      e.preventDefault();
  
      const formData = new FormData(this);
      let data = Object.fromEntries(formData.entries());
  
      // Normalize email
      data.email = data.email.trim().toLowerCase();
  
      try {
        const response = await fetch('/admin/confirm-payment', { 
          method: 'POST',
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
  
        if (response.status === 401 || response.status === 403) {
          window.location.href = '/admin-login.html';
          return;
        }
  
        const result = await response.json();
  
        if (response.ok) {
            const popup = document.getElementById('admin-success-popup');
            popup.style.display = "flex";   // Show popup
            setTimeout(() => {
            popup.style.display = "none"; // Hide popup
            window.location.href = "/admin-dashboard.html";
            }, 2000);
        } else {
          const msgDiv = document.getElementById("responseMsg");
          msgDiv.textContent = result.message || "Error confirming payment.";
          msgDiv.className = "alert alert-danger mt-3";
          msgDiv.classList.remove("d-none");
        }
      } catch (err) {
        console.error("Error confirming payment:", err);
        const msgDiv = document.getElementById("responseMsg");
        msgDiv.textContent = "Network or server error.";
        msgDiv.className = "alert alert-danger mt-3";
        msgDiv.classList.remove("d-none");
      }
    });
  </script>
  </body>
  </html>
