<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Camp 2025 Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('images/YouthCamp.png') no-repeat center center/cover;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        .card {
            position: relative;
            z-index: 1;
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .logo {
            display: block;
            margin: 0 auto 15px;
            width: 80px;
            height: auto;
        }
        h2 {
            color: #2575fc;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #2575fc;
            border: none;
        }
        .btn-primary:hover {
            background-color: #1b5fc6;
        }
        .progress-container {
            margin-bottom: 20px;
        }
        .progress-bar {
            background-color: #2575fc;
        }
        /* Popups */
        #loading-popup, #success-popup {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 9999;
            text-align: center;
            padding-top: 20%;
        }
        #loading-popup .content, #success-popup .content {
            background: #fff;
            display: inline-block;
            padding: 30px 50px;
            border-radius: 10px;
            font-size: 18px;
            color: #333;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        .spinner {
            margin: 20px auto;
            width: 40px; height: 40px;
            border: 5px solid #ccc;
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="card shadow-lg">
    <img src="images/church-logo.png" alt="Church Logo" class="logo">
    <h2 class="text-center mb-4">REPLIB Youth Camp 2025 Registration</h2>
    <p class="text-center text-muted">Kindly register to join us for an unforgettable camp experience!</p>

    <div class="progress-container">
        <div class="progress" style="height: 20px;">
            <div class="progress-bar" role="progressbar" style="width: 50%;">
                Step 1 of 2: Registration
            </div>
        </div>
    </div>

    <form id="registrationForm">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="fullname" class="form-control" placeholder="Enter your full name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Age</label>
            <input type="number" name="age" class="form-control" placeholder="Your age" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-select" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Church / Assembly</label>
            <input type="text" name="church" class="form-control" placeholder="Your church or assembly">
        </div>
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" name="phone" class="form-control" placeholder="e.g., 024xxxxxxx" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Pass Type</label>
            <select name="passType" class="form-select" required>
                <option value="">Select Pass</option>
                <option value="general">General Pass - GH₵ 999</option>
                <option value="team">Team Pass - GH₵ 4500</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" id="registerBtn"> <span id="btnText">Click to Register</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
          </button>
        </div>
      </form>

      <!-- Message -->
    <div id="registerMessage" class="alert mt-3"></div>
</div>

<script>
    const form = document.getElementById("registrationForm");
    const btn = document.getElementById("registerBtn");
    const btnText = document.getElementById("btnText");
    const btnSpinner = document.getElementById("btnSpinner");
    const msgDiv = document.getElementById("registerMessage");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      const formData = Object.fromEntries(new FormData(form).entries());

      // Show loading state
      btn.disabled = true;
      btnText.textContent = "Processing...";
      btnSpinner.classList.remove("d-none");
      msgDiv.className = "alert alert-info mt-3";
      msgDiv.textContent = "Submitting registration... please wait.";
      msgDiv.style.display = "block";

      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (response.ok) {
          msgDiv.className = "alert alert-success mt-3";
          msgDiv.textContent = "Registration successful! Redirecting to payment...";
          setTimeout(() => {
            const pass = formData.passType === "Team Pass" ? "team" : "general";
            window.location.href = `/payment.html?pass=${passType.toLowerCase()}&email=${encodeURIComponent(formData.email)}&phone=${encodeURIComponent(formData.phone)}`;
          }, 1500);
        } else {
          msgDiv.className = "alert alert-danger mt-3";
          msgDiv.textContent = data.message || "Registration failed. Please try again.";
          btn.disabled = false;
          btnText.textContent = "Register";
          btnSpinner.classList.add("d-none");
        }
      } catch (err) {
        console.error(err);
        msgDiv.className = "alert alert-danger mt-3";
        msgDiv.textContent = "Error submitting form.";
        btn.disabled = false;
        btnText.textContent = "Register";
        btnSpinner.classList.add("d-none");
      }
    });
  </script>
</body>
</html>
